[project]
name = "ats-resume-tailor"
version = "0.1.0"
description = "A resume tailor that can't make things up: every line traces to evidence you verified."
readme = "README.md"
license = "MIT"
authors = [{ name = "Akshay Swaminathan" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pypdf>=5",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
ats-resume-tailor = "ats_resume_tailor.cli:app"

[project.urls]
Homepage = "https://github.com/akshayyswami/ats-resume-tailor"
Issues = "https://github.com/akshayyswami/ats-resume-tailor/issues"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-pyyaml>=6.0.12.20261113",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_resume_tailor"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Raw model outputs are evidence. No formatter may touch them.
extend-exclude = ["evals/baseline"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "N", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "evals"]
mypy_path = "evals"

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
