# Planted faults. Two-sided on purpose.
#
# must_catch: a known-bad input. The check has to report the rule named in expect_rule.
# must_allow: a clean input. The check has to report no FAIL. This half is not optional: a checker
#             that rejects everything passes any one-sided test. A NOT CHECKED finding is allowed.
#
# kind: resume runs `verify` on a fixture resume against `bank` (default: the persona bank).
# kind: bank runs `check-evidence` on the fixture bank.
# kind: pdf runs `pdf-check` on a fixture PDF against `source`, the resume it was made from.
# Paths are relative to this directory. Fixture resumes use .txt so the repo's own markdown
# writing check does not flag the em dash and banned words planted in them.
#
# Every rule in core/verify.py must appear in expect_rule at least once. measure.py fails if not.

must_catch:
  # Resume faults: citations
  - id: no-evidence-id
    kind: resume
    input: fixtures/resumes/no-evidence-id.txt
    expect_rule: no-evidence-id
    reason: a claim with a real number and no evidence ID
  - id: paragraph-without-evidence
    kind: resume
    input: fixtures/resumes/paragraph-without-evidence.txt
    expect_rule: no-evidence-id
    reason: a summary paragraph is a claim too, and cites nothing
  - id: unknown-evidence-id
    kind: resume
    input: fixtures/resumes/unknown-evidence-id.txt
    expect_rule: unknown-evidence-id
    reason: cites E099, which is not in the bank
  - id: unverified-evidence-cited
    kind: resume
    bank: fixtures/banks/with-unverified.yaml
    input: fixtures/resumes/unverified-evidence-cited.txt
    expect_rule: unverified-evidence-cited
    reason: cites a fact that has no verification source

  # Resume faults: numbers
  - id: number-not-in-cited-evidence
    kind: resume
    input: fixtures/resumes/number-not-in-cited-evidence.txt
    expect_rule: number-not-in-cited-evidence
    reason: an inflated figure, 120 ms where the fact says 240 ms
  - id: number-from-other-fact
    kind: resume
    input: fixtures/resumes/number-from-other-fact.txt
    expect_rule: number-from-other-fact
    reason: a real 30 percent, taken from a fact the bullet does not cite

  # Resume faults: terms
  - id: not-claimable-term-bullet
    kind: resume
    input: fixtures/resumes/not-claimable-term-bullet.txt
    expect_rule: not-claimable-term
    reason: claims Spark, which the ledger marks not claimable
  - id: not-claimable-term-skills
    kind: resume
    input: fixtures/resumes/not-claimable-term-skills.txt
    expect_rule: not-claimable-term
    reason: lists Rust under Skills
  - id: adjacent-term-overclaim
    kind: resume
    input: fixtures/resumes/adjacent-term-overclaim.txt
    expect_rule: adjacent-term-overclaim
    reason: says "ran the Kubernetes cluster" where the ledger allows only the sanctioned wording
  - id: term-not-in-cited-evidence
    kind: resume
    input: fixtures/resumes/term-not-in-cited-evidence.txt
    expect_rule: term-not-in-cited-evidence
    reason: Kafka is a real skill of the persona, but not of the fact this bullet cites
  - id: unsupported-skill
    kind: resume
    input: fixtures/resumes/unsupported-skill.txt
    expect_rule: unsupported-skill
    reason: GraphQL is in no fact and not in the ledger, so it cannot be listed as a skill

  # Resume faults: corrections and style
  - id: known-wrong-claim
    kind: resume
    input: fixtures/resumes/known-wrong-claim.txt
    expect_rule: known-wrong-claim
    reason: repeats "led a team of 10", which the corrections list says is wrong
  - id: banned-word-builtin
    kind: resume
    input: fixtures/resumes/banned-word-builtin.txt
    expect_rule: banned-word
    reason: uses "spearheaded", on the built-in list
  - id: banned-word-bank
    kind: resume
    input: fixtures/resumes/banned-word-bank.txt
    expect_rule: banned-word
    reason: uses "rockstar", which only this bank bans
  - id: em-dash
    kind: resume
    input: fixtures/resumes/em-dash.txt
    expect_rule: em-dash
    reason: contains an em dash

  # Resume faults: the gap file
  - id: missing-requirement-claimed
    kind: resume
    gaps: fixtures/gaps/graphql-airflow.md
    input: fixtures/resumes/missing-requirement-claimed.txt
    expect_rule: missing-requirement-claimed
    reason: the gap file marks GraphQL MISSING and the bullet claims it
  - id: gap-term-not-in-cited-evidence
    kind: resume
    gaps: fixtures/gaps/graphql-airflow.md
    input: fixtures/resumes/gap-term-not-in-cited-evidence.txt
    expect_rule: term-not-in-cited-evidence
    reason: Airflow is named only by the gap file, and the cited fact does not support it
  - id: term-in-other-fact-text
    kind: resume
    gaps: fixtures/gaps/everyday-words.md
    input: fixtures/resumes/term-in-other-fact-text.txt
    expect_rule: term-not-in-cited-evidence
    reason: retries is in the gap file and in another fact's text, but not in the fact this bullet cites

  # PDF faults
  - id: pdf-no-extractable-text-blank
    kind: pdf
    input: fixtures/pdfs/blank.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: no-extractable-text
    reason: an empty page has no text at all
  - id: pdf-no-extractable-text-image-only
    kind: pdf
    input: fixtures/pdfs/image-only.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: no-extractable-text
    reason: the whole resume is a picture of text, so the file has no text to read
  - id: pdf-text-in-images-header
    kind: pdf
    input: fixtures/pdfs/image-header.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: text-in-images
    reason: the name and contact lines are a picture. Overall recall is 96 percent, so only the header check catches it
  - id: pdf-text-in-images-section
    kind: pdf
    input: fixtures/pdfs/image-section.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: text-in-images
    reason: the second job and the Skills list are a picture, so a fifth of the words are missing
  - id: pdf-low-token-recall
    kind: pdf
    input: fixtures/pdfs/half-resume.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: low-token-recall
    reason: the PDF holds only the first half of the resume and has no images
  - id: pdf-reading-order-broken
    kind: pdf
    input: fixtures/pdfs/two-column.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: reading-order-broken
    reason: two columns read clean in drawing order and interleave when read by visual line
  - id: pdf-reading-order-broken-stream
    kind: pdf
    input: fixtures/pdfs/stream-scrambled.pdf
    source: ../examples/persona/resume.clean.md
    expect_rule: reading-order-broken
    reason: a column drawn bottom to top looks right and reads in reverse in drawing order

  # Evidence bank faults
  - id: duplicate-id
    kind: bank
    input: fixtures/banks/duplicate-id.yaml
    expect_rule: duplicate-id
    reason: two facts share E001, so a citation would be ambiguous
  - id: missing-verified
    kind: bank
    input: fixtures/banks/missing-verified.yaml
    expect_rule: missing-verified
    reason: a fact with no verification source and date
  - id: metric-without-number
    kind: bank
    input: fixtures/banks/metric-without-number.yaml
    expect_rule: metric-without-number
    reason: a metric fact that states no number
  - id: claimable-without-evidence
    kind: bank
    input: fixtures/banks/claimable-without-evidence.yaml
    expect_rule: claimable-without-evidence
    reason: the ledger says Scala is claimable and no fact lists it
  - id: adjacent-incomplete
    kind: bank
    input: fixtures/banks/adjacent-incomplete.yaml
    expect_rule: adjacent-incomplete
    reason: an adjacent term with no sanctioned wording and no supporting facts

must_allow:
  - id: clean-persona-resume
    kind: resume
    input: ../examples/persona/resume.md
    reason: the sample resume, every line cited and every figure from its facts
  - id: persona-bank-clean
    kind: bank
    input: ../examples/persona/evidence.yaml
    reason: the sample bank passes its own checks
  - id: weakly-checked-bullet
    kind: resume
    input: fixtures/resumes/ok-weakly-checked.txt
    reason: a cited bullet with no number and no known term passes, reported as not checked
  - id: number-formats
    kind: resume
    input: fixtures/resumes/ok-number-formats.txt
    reason: the figure 1200 matches 1,200 and 30 percent matches 30%
  - id: word-boundary
    kind: resume
    input: fixtures/resumes/ok-word-boundary.txt
    reason: rust inside trusted and react inside reacted are not the skills
  - id: short-term-case
    kind: resume
    input: fixtures/resumes/ok-short-term-case.txt
    reason: the verb "go" in lower case is not the language Go
  - id: gap-honest-resume
    kind: resume
    gaps: ../examples/persona/gap.md
    input: ../examples/persona/resume.md
    reason: the sample resume against its own gap file, with GraphQL and Terraform left out
  - id: gap-term-in-fact-text
    kind: resume
    gaps: fixtures/gaps/everyday-words.md
    input: fixtures/resumes/ok-gap-term-in-fact-text.txt
    reason: a bullet that restates its fact word for word passes when the gap file names a word the fact says
  - id: pdf-one-column
    kind: pdf
    input: fixtures/pdfs/one-column.pdf
    source: ../examples/persona/resume.clean.md
    reason: a single-column PDF of the resume comes back whole in both reading orders
  - id: pdf-one-column-with-logo
    kind: pdf
    input: fixtures/pdfs/one-column-with-logo.pdf
    source: ../examples/persona/resume.clean.md
    reason: a decorative image alone is not a failure when every word still comes back
