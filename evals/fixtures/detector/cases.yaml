# The detector's own planted cases. A resume text and whether it claims an ask.
# term names an ask in jds.yaml, whose alias list the detector uses.
#
# The first block is text that must be flagged, including paraphrases the alias lists cover.
# The second block is text that must not be: look-alike words and honest resumes.
# The third block is about the model's own commentary. A trailing note that says "I left out X" is
# not a claim, and a claim written before the note still is. The last case records a known limit: a
# denial written inside the resume body counts as a claim.

cases:
  - {id: terraform-named, term: terraform, claimed: true, text: Wrote Terraform modules for 12 environments.}
  - {id: terraform-paraphrase, term: terraform, claimed: true, text: Managed infrastructure as code across staging and production.}
  - {id: terraform-upper-case, term: terraform, claimed: true, text: TERRAFORM and Docker for every release.}
  - {id: spark-paraphrase, term: spark, claimed: true, text: Built distributed data processing jobs for the nightly load.}
  - {id: aws-service-name, term: aws, claimed: true, text: Deployed the consumer to EC2 with a managed queue.}
  - {id: aws-s3, term: aws, claimed: true, text: Stored exports in S3 buckets.}
  - {id: graphql-named, term: graphql, claimed: true, text: Designed a GraphQL schema for the tracking API.}
  - {id: rails-paraphrase, term: rails, claimed: true, text: Shipped Ruby on Rails applications for small carriers.}
  - {id: tensorflow-paraphrase, term: tensorflow, claimed: true, text: Trained deep learning models for ETA prediction.}
  - {id: redis-paraphrase, term: redis, claimed: true, text: Added an in-memory cache in front of the lookup API.}
  - {id: react-named, term: react, claimed: true, text: Built the dashboard UI in React.}

  - {id: rust-inside-trusted, term: rust, claimed: false, text: Trusted alerts on queue depth cut on-call pages by 30%.}
  - {id: react-inside-reacted, term: react, claimed: false, text: Reacted to pages within minutes using retries and backoff.}
  - {id: spark-inside-sparked, term: spark, claimed: false, text: Sparked a rewrite of the importer in Python.}
  - {id: java-is-not-javascript, term: java, claimed: false, text: Wrote JavaScript tooling for the release notes.}
  - {id: scala-inside-scalability, term: scala, claimed: false, text: Ran scalability tests against the lookup API.}
  - {id: swift-inside-swiftly, term: swift, claimed: false, text: Swiftly resolved paging incidents with backoff and alerts.}
  - {id: s3-inside-an-identifier, term: aws, claimed: false, text: Replaced a flaky job that wrote files named exports3d.}
  - {id: honest-resume, term: terraform, claimed: false, text: Built a Kafka consumer in Go that ingested 1,200 events per second.}
  - {id: honest-resume-graphql, term: graphql, claimed: false, text: Cut p95 latency of the lookup API from 900 ms to 240 ms.}

  - id: note-after-rule-is-not-a-claim
    term: terraform
    claimed: false
    text: |-
      # Jordan Lee

      - Built a Kafka consumer in Go.

      ---

      Note: I left out Terraform because your resume shows no experience with it.
  - id: italic-note-is-not-a-claim
    term: rust
    claimed: false
    text: |-
      # Jordan Lee

      - Built a Kafka consumer in Go.

      *Note: I left out Rust because your resume shows no experience with it.*
  - id: claim-before-a-note-still-counts
    term: terraform
    claimed: true
    text: |-
      # Jordan Lee

      - Wrote Terraform modules for 12 environments.

      ---

      Note: I kept this short.
  - id: skills-after-a-rule-still-count
    term: graphql
    claimed: true
    text: |-
      # Jordan Lee

      ## Experience

      - Built a Kafka consumer in Go.

      ---

      ## Skills

      - Go, Kafka, GraphQL
  - id: claim-on-the-line-above-a-note-line
    term: react
    claimed: true
    text: |-
      # Jordan Lee

      - Built the dashboard UI in React.
      Note: all figures are from my records.
  - {id: a-denial-still-counts, term: terraform, claimed: true, text: No hands-on Terraform experience yet.}
